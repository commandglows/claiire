          - listitem [ref=f7e90]:
            - link "notre dossier sur les relations" [ref=f7e91] [cursor=pointer]:
              - /url: /relations/
        - heading "Ce que tu débloques en allant plus loin" [level=2] [ref=f7e92]
        - paragraph [ref=f7e93]: Les pages publiques te donnent le cadre et les bases.
        - paragraph [ref=f7e94]: "La logique premium de la formation ajoute la partie la plus guidée :"
        - list [ref=f7e95]:
          - listitem [ref=f7e96]: exercices
          - listitem [ref=f7e97]: checklists
          - listitem [ref=f7e98]: protocoles
          - listitem [ref=f7e99]: repères de progression
          - listitem [ref=f7e100]: ressources pratiques plus profondes
        - paragraph [ref=f7e101]: L’idée n’est pas de te frustrer. L’idée est de garder l’essentiel visible, puis de réserver la partie la plus accompagnante à la version complète.
        - heading "Quelques mots importants" [level=2] [ref=f7e102]
        - paragraph [ref=f7e103]: Ce parcours ne remplace pas une thérapie. Si tu es très submergé(e), dissocié(e), en danger ou sans appui autour de toi, il faut aussi du soutien humain réel.
        - paragraph [ref=f7e104]:
          - text: Si tu es en danger maintenant, priorise les ressources immédiates via
          - link "l’espace victimes" [ref=f7e105] [cursor=pointer]:
            - /url: /violence/victimes/
          - text: .
        - heading "FAQ" [level=2] [ref=f7e106]
        - heading "Dois-je commencer par des contenus généraux ?" [level=3] [ref=f7e107]
        - paragraph [ref=f7e108]: Non. Si une relation t’inquiète, tu peux commencer directement ici. Les ressources de santé et de bien-être restent disponibles en complément.
        - heading "Est-ce que ce parcours est utile si la violence est ancienne ?" [level=3] [ref=f7e109]
        - paragraph [ref=f7e110]: Oui. Les traces peuvent rester très actives longtemps après.
        - heading "Est-ce que je dois tout faire d’un coup ?" [level=3] [ref=f7e111]
        - paragraph [ref=f7e112]: Non. Ce parcours est justement conçu pour être suivi étape par étape.
        - heading "Comment utiliser ce parcours" [level=2] [ref=f7e113]
        - paragraph [ref=f7e114]: Commence par la page publique du module qui correspond à ton étape actuelle.
        - paragraph [ref=f7e115]: Quand tu sens que tu as besoin d’un cadre plus guidé, tu peux débloquer la version complète pour accéder au contenu intégral, à la checklist, au protocole et aux ressources premium sans perdre le fil.
