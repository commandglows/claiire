      - paragraph [ref=f7e23]: Parcours relationnels
      - heading "Ce que tu vis dans ta relation t'inquiète" [level=1] [ref=f7e24]
      - paragraph [ref=f7e25]: Tu n'as pas besoin de te définir comme victime pour commencer. Ce parcours part des faits, de ta sécurité et de ton rythme.
