            - heading "Étape 1 — Connaître tes biais cognitifs" [level=2] [ref=f14e91]
            - paragraph [ref=f14e92]: Ton cerveau prend des raccourcis. Certains t'aident, d'autres te piègent. Les biais cognitifs colorent ta perception de la réalité sans que tu t'en rendes compte. Les identifier, c'est déjà s'en affranchir partiellement.
