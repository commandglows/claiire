            - paragraph [ref=f12e88]:
              - strong [ref=f12e89]: Ce parcours te guide pour comprendre tes patterns relationnels, sortir des liens qui t'épuisent et construire des relations qui te font grandir. Les relations, ça s'apprend — et ça commence par soi.
            - separator [ref=f12e90]
            - heading "Étape 1 — Comprendre tes patterns (théorie de l'attachement)" [level=2] [ref=f12e91]
            - paragraph [ref=f12e92]: Tes relations adultes portent souvent la trace de tes premières expériences d'attachement. Comprendre ton style d'attachement, c'est mettre des mots sur tes schémas répétitifs — et commencer à les transformer.
