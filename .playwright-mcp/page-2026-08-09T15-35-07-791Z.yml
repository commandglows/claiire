            - heading "Étape 3 — Poser tes limites" [level=2] [ref=f12e105]
            - paragraph [ref=f12e106]: "Dire non sans culpabiliser, exprimer ses besoins sans agressivité, s'affirmer avec respect : les limites ne détruisent pas les relations, elles les protègent. Cette étape est souvent la plus transformatrice du parcours."
