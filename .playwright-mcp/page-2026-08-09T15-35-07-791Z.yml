            - heading "Étape 2 — Reconnaître les relations toxiques" [level=2] [ref=f12e98]
            - paragraph [ref=f12e99]: Pas toutes les relations méritent d'être préservées. Cette étape t'aide à identifier les dynamiques toxiques — manipulation, emprise, relations asymétriques — pour ne plus les confondre avec de l'amour ou de l'amitié.
