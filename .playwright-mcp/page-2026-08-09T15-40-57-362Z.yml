              - strong [ref=f17e89]: "À l'issue de ce parcours, tu comprendras pourquoi le bonheur se construit — et tu auras des outils concrets pour le faire. Pas de promesses magiques : de la science, des pratiques testées, et un chemin qui te ressemble."
            - separator [ref=f17e90]
            - heading "Étape 1 — Comprendre le bonheur (la science derrière)" [level=2] [ref=f17e91]
            - paragraph [ref=f17e92]: Le bonheur n'est pas un hasard. Dopamine, sérotonine, ocytocine, endorphines — quatre molécules qui jouent un rôle clé dans ton bien-être. Comprendre leur fonctionnement, c'est apprendre à les activer volontairement.
