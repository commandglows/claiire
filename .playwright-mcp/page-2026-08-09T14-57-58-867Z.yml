    - main [ref=f8e30]:
      - article [ref=f8e31]:
        - paragraph [ref=f8e32]: Merci d’être là.
        - paragraph [ref=f8e33]: Si tu lis cette page, quelque chose dans une relation actuelle ou passée t’inquiète peut-être. Tu n’as pas besoin d’être déjà sûr(e) du mot « violence ». Tu as besoin d’un chemin qui respecte ton rythme, sans minimiser les faits ni décider à ta place.
        - paragraph [ref=f8e34]: C’est le rôle de ce parcours.
        - heading "Ce parcours sert à quoi ?" [level=2] [ref=f8e35]
        - paragraph [ref=f8e36]: "Le parcours victimes t’aide à avancer sur six axes :"
        - list [ref=f8e37]:
          - listitem [ref=f8e38]: retrouver de la sécurité
          - listitem [ref=f8e39]: comprendre le trauma
          - listitem [ref=f8e40]: poser tes limites
          - listitem [ref=f8e41]: reconstruire des relations plus saines
          - listitem [ref=f8e42]: reprendre ton autonomie
          - listitem [ref=f8e43]: ancrer ce que tu reconstruis dans la durée
        - paragraph [ref=f8e44]: Il ne te demande pas d’aller bien tout de suite. Il te donne des étapes.
        - heading "Les 6 modules du parcours victimes" [level=2] [ref=f8e45]
        - heading "1. Ton plan de sécurité" [level=3] [ref=f8e46]
        - paragraph [ref=f8e47]:
          - link "Accéder au module 1" [ref=f8e48] [cursor=pointer]:
            - /url: /formations/victimes/1-securite/
        - paragraph [ref=f8e49]: "Tu poses les bases les plus concrètes : sécurité immédiate, personnes relais, repères, priorités."
        - heading "2. Guérir du trauma" [level=3] [ref=f8e50]
        - paragraph [ref=f8e51]:
          - link "Accéder au module 2" [ref=f8e52] [cursor=pointer]:
            - /url: /formations/victimes/2-guerison/
        - paragraph [ref=f8e53]: Tu comprends pourquoi la guérison n’est pas linéaire, ce que le trauma fait au corps, et comment avancer sans te brusquer.
        - heading "3. Poser tes limites" [level=3] [ref=f8e54]
        - paragraph [ref=f8e55]:
          - link "Accéder au module 3" [ref=f8e56] [cursor=pointer]:
            - /url: /formations/victimes/3-limites/
        - paragraph [ref=f8e57]: Tu retrouves peu à peu le droit de dire oui, non, stop, plus tard, autrement.
        - heading "4. Reconstruction relationnelle" [level=3] [ref=f8e58]
        - paragraph [ref=f8e59]:
          - link "Accéder au module 4" [ref=f8e60] [cursor=pointer]:
            - /url: /formations/victimes/4-relations/
        - paragraph [ref=f8e61]: Tu travailles les repères relationnels, la confiance et la capacité à reconnaître ce qui est sain.
        - heading "5. Ton autonomie" [level=3] [ref=f8e62]
        - paragraph [ref=f8e63]:
          - link "Accéder au module 5" [ref=f8e64] [cursor=pointer]:
            - /url: /formations/victimes/5-autonomie/
        - paragraph [ref=f8e65]: Tu renforces ta capacité à décider, agir, choisir et te remettre au centre de ta propre vie.
        - heading "6. Ancrage durable" [level=3] [ref=f8e66]
        - paragraph [ref=f8e67]:
          - link "Accéder au module 6" [ref=f8e68] [cursor=pointer]:
            - /url: /formations/victimes/6-ancrage/
        - paragraph [ref=f8e69]: Tu apprends à consolider ce que tu reconstruis pour ne pas perdre pied dès qu’un moment difficile revient.
        - heading "Ce parcours est pour toi si…" [level=2] [ref=f8e70]
        - list [ref=f8e71]:
          - listitem [ref=f8e72]: tu te sens encore sous l’effet de ce que tu as vécu
          - listitem [ref=f8e73]: tu as du mal à distinguer sécurité, peur, trauma et emprise
          - listitem [ref=f8e74]: tu veux comprendre sans te faire violence
          - listitem [ref=f8e75]: tu cherches un cadre plus structuré que des lectures dispersées
        - heading "Les repères cliniques derrière ce parcours" [level=2] [ref=f8e76]
        - paragraph [ref=f8e77]:
          - text: Le parcours s’appuie notamment sur le travail de
          - strong [ref=f8e78]: Judith Herman
          - text: ": sécurité, intégration, reconnexion. Ce cadre est utile parce qu’il remet la reconstruction dans le bon ordre."
        - paragraph [ref=f8e79]: Avant de réparer la suite, il faut assez de sécurité.
        - paragraph [ref=f8e80]: Avant de reprendre confiance, il faut comprendre ce que le trauma a fait au corps, aux émotions et aux relations.
        - heading "Ce que tu peux lire en parallèle" [level=2] [ref=f8e81]
