            - heading "Étape 1 — Comprendre le bonheur (la science derrière)" [level=2] [ref=f9e91]
            - paragraph [ref=f9e92]: Le bonheur n'est pas un hasard. Dopamine, sérotonine, ocytocine, endorphines — quatre molécules qui jouent un rôle clé dans ton bien-être. Comprendre leur fonctionnement, c'est apprendre à les activer volontairement.
